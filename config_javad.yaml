# ─────────────────────────────────────────────────────────────────────────────
# jobhunt/config_javad.yaml  — Javad Aman (Senior / Applied Data Scientist)
# ─────────────────────────────────────────────────────────────────────────────

my_profile: |
  Javad Aman is a Data Scientist with 6+ years of experience delivering
  production AI/ML in finance and manufacturing, with multimillion-dollar impact
  from forecasting and anomaly-detection systems. He is currently a Data
  Scientist II at Caterpillar (Dallas, TX) and holds a Ph.D. in Transportation
  Engineering (machine learning on large-scale mobility data) from SMU and an
  M.S. from Sharif University of Technology. He is a U.S. Green Card holder
  based in Dallas, TX.

  Core expertise: forecasting at scale (CatBoost, GPBoost ensembles), anomaly
  detection, causal inference and A/B testing, supervised and unsupervised ML,
  NLP, and applied GenAI (RAG, agent workflows, multi-agent systems with
  LangChain/LangGraph, vector search, LLM classification, LLM evaluation).
  Owns the full lifecycle from ideation to production: MLOps, model monitoring,
  drift detection, CI/CD, Snowflake, Azure (AI Foundry), AWS (SageMaker, Lambda,
  Glue), Docker, Kubernetes. Languages/tools: Python, SQL, R, PyTorch,
  TensorFlow, Power BI, Tableau. Mentors junior data scientists. Peer-reviewed
  publications in transportation/ML.

  Target roles: Senior / Lead / Staff Data Scientist, Applied Scientist, Machine
  Learning Scientist, GenAI / LLM Data Scientist. Wants high compensation and
  high-profile, well-known employers (big tech, top fintech and AI companies,
  large enterprises) with strong data-science and ML maturity and real
  production impact. Prefers in-house product/DS teams over body-shop
  consulting. NOT interested in junior/entry-level roles, pure data-analyst or BI
  roles, pure software/data/ML-infrastructure engineering roles, or sales roles.
  Location: Dallas, TX area (hybrid or onsite) or fully remote within the U.S.

search:
  terms:
    - "senior data scientist"
    - "lead data scientist"
    - "staff data scientist"
    - "applied scientist"
    - "machine learning scientist"
    - "data scientist generative AI"
  hours_old: 168
  results_wanted: 100
  boards:
    - indeed

