# ── Scoring rubric (replaces the built-in UX-designer rubric) ────────────────
scoring:
  role_label: "Senior / Applied Data Scientist (high-compensation, high-profile employers)"
  rules: |
    - If the title is Data Analyst, BI Analyst, Business Analyst, Data Engineer, ML/AI Engineer,
      Software Engineer, DevOps, Product Manager, Program Manager, Sales, or Recruiter:
      score 0–20 unless the description clearly makes it a modeling/science role.
    - Junior, entry-level, intern, new-grad, or "Data Scientist I" roles: score 0–25.
    - Director/VP/Head-of roles (people management with no hands-on modeling): score 20–40.
    - Mid-level Data Scientist (2–4 yrs required, no senior/lead scope): cap at 55.
    - Senior / Lead / Staff / Principal Data Scientist, Applied Scientist, ML Scientist,
      or GenAI/LLM Data Scientist with ownership of production models: score 70–100.
    - Add up to +10 for a high-profile employer (big tech, top fintech/AI lab, Fortune 500
      with mature DS org) and +5 for stated compensation that looks senior (roughly $180k+
      base or $250k+ total); subtract up to 10 for unknown/low-profile staffing or
      consulting body shops and for postings with obvious below-senior pay.
    - Strong overlap with the candidate's strengths (forecasting, anomaly detection,
      causal inference/experimentation, GenAI/RAG/agents, MLOps) raises the score;
      pure computer-vision, robotics, or research-only roles needing a different
      specialty lower it. Fully remote U.S. or Dallas-area only; other cities lose 25.

